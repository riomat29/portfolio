 12%{transform:scale(.008,.012);opacity:1;filter:brightness(3);background-color:#fff;box-shadow:0 0 40px 14px rgba(255,255,255,.95)}
 46%{transform:scale(1,.012);filter:brightness(2.4);background-color:#e6eeff;box-shadow:0 0 50px 8px rgba(190,215,255,.9)}
 100%{transform:none;filter:none}}

}

@keyframes crtBg{0%,60%{opacity:1}100%{opacity:0}}

 42%{transform:scale(1,.012);filter:brightness(2.4);background-color:#e6eeff;box-shadow:0 0 50px 8px rgba(190,215,255,.9)}
 82%{transform:scale(.008,.012);filter:brightness(3);background-color:#fff;box-shadow:0 0 40px 14px rgba(255,255,255,.95);opacity:1}
 100%{transform:scale(0,0);opacity:0}}
}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const D = window.PORTFOLIO, P = D.profile;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ul = a => a && a.length ? `<ul>${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
const pills = a => (a || []).map(x => `<span class="pill">${esc(x)}</span>`).join('');
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const store = { get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }, set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} } };
const setHash = h => { try { history.replaceState(null, '', h || (location.pathname + location.search)); } catch (e) {} };

/* ---------- Theme: follows the viewer unless the toggle is used ---------- */
const root = document.documentElement;
const saved = store.get('theme2'); if (saved === 'light' || saved === 'dark' || saved === 'red' || saved === 'navy' || saved === 'studio') root.dataset.theme = saved;
const effTheme = () => root.dataset.theme || 'dark';  // dark navy and blue is always the first theme; a saved choice overrides it

/* ---------- Render ---------- */
const sections = [['about','About'],['projects','Projects'],['experience','Experience'],['skills','Skills'],['education','Education'],
  ...(D.extra||[]).map((e,i)=>['extra'+i,e.title]),['contact','Contact']];
const HOME_IC = '<svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.8V20h4.2v-5.2h4.6V20h4.2V9.8"/></svg>';
const NI = d => `<svg class="ic" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const NAVIC = {
  about: NI('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-6 7-6s7 2.1 7 6"/>'),
  projects: NI('<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'),
  experience: NI('<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 13h18"/>'),
  skills: NI('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'),
  education: NI('<path d="M2.5 9 12 4l9.5 5-9.5 5z"/><path d="M6.5 11.5V16c1.5 1.6 3.4 2.5 5.5 2.5s4-.9 5.5-2.5v-4.5M21.5 9v5"/>'),
  contact: NI('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/>')
};
$('#nav').innerHTML = `<b><a class="brand" href="#hero" aria-label="${esc(P.name)}, back to top">${esc(P.name)}</a></b>` + `<a class="l home" href="#hero" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.8V20h4.2v-5.2h4.6V20h4.2V9.8"/></svg></a>` + sections.map(([id,l])=>`<a class="l" href="#${id}" aria-label="${esc(l)}">${NAVIC[id]||''}<span class="tx">${esc(l)}</span></a>`).join('') + `<button id="theme" aria-label="Change colour theme">◐</button>`;
const THEMES = [['dark', 'Charcoal, sand and electric blue', '◐'], ['light', 'Forest green and beige', '◑'], ['red', 'Cream, ink and burnt orange', '●'], ['navy', 'Navy, cream and coral', '◆'], ['studio', 'Studio: monochrome mono', '▣']];
const paintThemeBtn = () => { const i = Math.max(0, THEMES.findIndex(t => t[0] === effTheme())), nx = THEMES[(i + 1) % THEMES.length], b = $('#theme');
  b.textContent = THEMES[i][2]; b.title = 'Theme: ' + THEMES[i][1] + '. Click for ' + nx[1] + '.'; b.setAttribute('aria-label', b.title); b.style.color = THEMES[i][0] === 'red' ? 'var(--acc)' : ''; };
$('#theme').onclick = () => { const i = Math.max(0, THEMES.findIndex(t => t[0] === effTheme())), t = THEMES[(i + 1) % THEMES.length][0]; root.dataset.theme = t; store.set('theme2', t); paintThemeBtn(); };
paintThemeBtn();

$('#hero-text').innerHTML = `
  <div class="kick">${esc(P.location)}</div>
  <h1>${esc(P.name)}</h1>
  <div class="typed" id="typed"></div>
  <p>${esc(P.tagline)}</p>
  <a class="btn pri" href="#projects"><span>Explore projects</span><span class="arw" aria-hidden="true">&rarr;</span></a><a class="btn" href="#contact">Get in touch</a>`;

const sec = (id,title,inner,cls='') => `<section class="s ${cls}" id="${id}"><div class="wrap"><h2>${esc(title)}</h2>${inner}</div></section>`;
const catSet = [...new Set(D.projects.flatMap(p => p.tag.split('·').map(s => s.trim())))];
const groups = D.filterGroups || {};                       // merged filter entries from data.js
const grouped = new Set(Object.values(groups).flat());
const tagsOf = p => p.tag.split('·').map(s => s.trim());
const cats = [...Object.keys(groups), ...catSet.filter(c => !grouped.has(c))];
const matchCat = (p, c) => c === 'All' || (c === 'In progress' ? p.status === 'In progress' : tagsOf(p).some(t => (groups[c] || [c]).includes(t)));
const fmenuItems = ['All', 'In progress', ...cats].map(c => { const n = D.projects.filter(p => matchCat(p, c)).length;
  return `<button class="mi" type="button" role="option" data-filter="${esc(c)}" aria-selected="${c === 'All'}"><span>${esc(c === 'All' ? 'All projects (clear filter)' : c)}</span><small>${n}</small></button>`; }).join('');
const filterTab = `<span class="chipgroup" id="fltgrp"><button class="ftab" id="fltbtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="fmenu"><span id="fltlabel">Filter</span><span aria-hidden="true">&#9662;</span></button><div id="fmenu" role="listbox" aria-label="Filter projects" hidden>${fmenuItems}</div></span>`;
const chips = filterTab;
const cards = D.projects.map((p,i)=>`
  <article class="card" data-i="${i}">
    <div class="thumb" data-thumb="${i}" data-open="${i}" title="Open 3D view">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">`:''}<span class="badge">3D view${p.media && p.media.length ? ` · ${p.media.length} media` : ''}</span></div>
    <div class="body"><span class="tag">${esc(p.tag)}</span><h3>${esc(p.title)}</h3>
      <div><span class="pill ${p.status==='In progress'?'live':''}">${esc(p.status)}</span>${p.dates?`<span class="pill">${esc(p.dates)}</span>`:""}</div>
      <div style="color:var(--mut);font-size:15px">${esc(p.summary)}</div>
      <button class="open" data-open="${i}">Details &amp; 3D view</button></div>
  </article>`).join('');
const exp = D.experience.map((j,i)=>`<details class="job${/Present/i.test(j.dates)?' now':''}" ${i===0?'open':''}><summary><h3>${esc(j.role)} · ${esc(j.org)}</h3><div class="meta">${esc([j.place,j.dates].filter(Boolean).join(' · '))}</div></summary>${ul(j.bullets)||'<div class="meta" style="margin-top:8px">Details to add.</div>'}</details>`).join('');
