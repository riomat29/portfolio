<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const D = window.PORTFOLIO, P = D.profile;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ul = a => a && a.length ? `<ul>${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
const pills = a => (a || []).map(x => `<span class="pill">${esc(x)}</span>`).join('');
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const store = { get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }, set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} } };
const setHash = h => { try { history.replaceState(null, '', h || (location.pathname + location.search)); } catch (e) {} };

/* ---------- Theme: follows the viewer unless the toggle is used ---------- */
const root = document.documentElement;
const saved = store.get('theme'); if (saved === 'light' || saved === 'dark' || saved === 'red') root.dataset.theme = saved;
const effTheme = () => root.dataset.theme || (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');

/* ---------- Render ---------- */
const sections = [['about','About'],['projects','Projects'],['experience','Experience'],['skills','Skills'],['education','Education'],
  ...(D.extra||[]).map((e,i)=>['extra'+i,e.title]),['contact','Contact']];
$('#nav').innerHTML = `<b>${esc(P.name)}</b>` + sections.map(([id,l])=>`<a class="l" href="#${id}">${esc(l)}</a>`).join('') + `<button id="theme" aria-label="Change colour theme">◐</button>`;
const THEMES = [['dark', 'Dark navy and blue', '◐'], ['light', 'White and light green', '◑'], ['red', 'Charcoal grey and red', '●']];
const paintThemeBtn = () => { const i = Math.max(0, THEMES.findIndex(t => t[0] === effTheme())), nx = THEMES[(i + 1) % THEMES.length], b = $('#theme');
  b.textContent = THEMES[i][2]; b.title = 'Theme: ' + THEMES[i][1] + '. Click for ' + nx[1] + '.'; b.setAttribute('aria-label', b.title); b.style.color = THEMES[i][0] === 'red' ? 'var(--acc)' : ''; };
$('#theme').onclick = () => { const i = Math.max(0, THEMES.findIndex(t => t[0] === effTheme())), t = THEMES[(i + 1) % THEMES.length][0]; root.dataset.theme = t; store.set('theme', t); paintThemeBtn(); };
paintThemeBtn(); matchMedia('(prefers-color-scheme:light)').addEventListener('change', paintThemeBtn);

$('#hero-text').innerHTML = `
  <div class="kick">${esc(P.location)}</div>
  <h1>${esc(P.name)}</h1>
  <div class="typed" id="typed"></div>
  <p>${esc(P.tagline)}</p>
  <a class="btn pri" href="#projects">Explore projects</a><a class="btn" href="#contact">Get in touch</a>`;

const sec = (id,title,inner,cls='') => `<section class="s ${cls}" id="${id}"><div class="wrap"><h2>${esc(title)}</h2>${inner}</div></section>`;
const catSet = [...new Set(D.projects.flatMap(p => p.tag.split('·').map(s => s.trim())))];
const groups = D.filterGroups || {};                       // merged filter entries from data.js
const grouped = new Set(Object.values(groups).flat());
const tagsOf = p => p.tag.split('·').map(s => s.trim());
